<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">Archiv</div>
    <nav>
        <ul>
            <li><a href="index.html">Start</a></li>
            <li><a href="seite2.html">Über uns</a></li>
            <li><a href="seite3.html">Projekte</a></li>
            <li><a href="seite4.html">Galerie</a></li>
            <li><a href="seite5.html" class="active">Downloads</a></li>
            <li><a href="seite6.html">Kontakt</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="card">
        <h1>Downloads</h1>
        <div id="downloadList" class="download-list">
            <div class="empty-state">Lade Dateien ...</div>
        </div>
    </div>
</main>

<script>
    async function loadDownloads() {
        const listEl = document.getElementById('downloadList');
        try {
            const res = await fetch('/manifest.json', { cache: 'no-store' });
            if (!res.ok) throw new Error('Liste konnte nicht geladen werden');
            const items = await res.json();
            const downloads = items.filter(item => item.category === 'downloads');

            if (!downloads.length) {
                listEl.innerHTML = '<div class="empty-state">Noch keine Dateien hochgeladen.</div>';
                return;
            }

            listEl.innerHTML = downloads.map(item => `
                <div class="download-item">
                    <div>
                        <div class="download-item-title">${item.title || item.original_name}</div>
                        <div class="download-item-meta">${new Date(item.upload_date).toLocaleDateString('de-DE')} &middot; ${item.original_name}</div>
                        ${item.description ? `<div class="download-item-description">${item.description}</div>` : ''}
                    </div>
                    <a class="download-btn" href="${item.url}" download>Herunterladen</a>
                </div>
            `).join('');
        } catch (err) {
            listEl.innerHTML = `<div class="empty-state">${err.message}</div>`;
        }
    }

    loadDownloads();
</script>

</body>
</html>
