services:
  webserver:
    image: nginx:alpine
    container_name: erste-website-nginx
    ports:
      - "8090:80"
    volumes:
      - /DATA/AppData/erste-website/site:/var/www/html:ro
      - /DATA/AppData/erste-website/uploads:/var/www/uploads:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: ./app
    container_name: erste-website-app
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      UPLOAD_FOLDER: /uploads
    volumes:
      - /DATA/AppData/erste-website/uploads:/uploads
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: erste-website-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /DATA/AppData/erste-website/db-data:/var/lib/postgresql/data
      - ./app/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    restart: unless-stopped